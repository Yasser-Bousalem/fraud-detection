# docker-compose.yml

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: fraud-detection-api:latest
    container_name: fraud-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s